<style>
  .news-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85em;
    margin-bottom: 2em;
  }
  .news-table td {
    padding: 0.5em 0.6em;
    border: none;
    border-bottom: 1px solid rgba(128, 128, 128, 0.25);
    vertical-align: top;
    background: none;
  }
  .news-table tr:last-child td {
    border-bottom: none;
  }
  .news-table .news-date {
    white-space: nowrap;
    color: rgba(128, 128, 128, 0.95);
    width: 1%;
  }
  .news-table .news-content p {
    margin: 0;
  }
</style>

<h2>news</h2>
<table class="news-table">
  {% assign items = site.news | sort: 'date' | reverse %}
  {% for item in items limit: 5 %}
    <tr>
      <td class="news-date">{{ item.date | date: "%b %Y" }}</td>
      <td class="news-content">{{ item.content | markdownify }}</td>
    </tr>
  {% endfor %}
</table>
